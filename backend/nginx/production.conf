# Nginx Production Configuration - Hillary Step Solutions
# Deployment Topology: Cloudflare -> Nginx -> Fastify (Node.js)

# We define the real IP from Cloudflare's connecting IP header
# This allows Nginx to use the true client IP for its own logging and limits,
# and to pass it to Fastify securely.

# Cloudflare IPv4 ranges
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# Cloudflare IPv6 ranges
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Extract the real IP from this header
real_ip_header CF-Connecting-IP;

# Limit zones to mitigate slow/excessive requests at the edge
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    listen [::]:80;
    server_name api.hillarystep.com;

    # Force HTTPS redirect if not terminated at Cloudflare
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.hillarystep.com;

    # SSL Configuration (using Let's Encrypt or Cloudflare Origin CA)
    # ssl_certificate /etc/ssl/certs/cloudflare_origin.pem;
    # ssl_certificate_key /etc/ssl/private/cloudflare_origin.key;
    
    # Modern TLS standards
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Deny all traffic not coming from Cloudflare
    # Using real_ip module, if traffic is NOT from CF, $remote_addr won't be replaced
    # and $http_cf_connecting_ip might be spoofed, but we don't care because Nginx
    # drops it if we block non-CF IPs at the firewall. 
    # Best practice is to block non-CF IPs via AWS Security Group.
    # As a fallback, ensure the connecting IP header exists.
    if ($http_cf_connecting_ip = "") {
        return 403;
    }

    # Resume upload limits (5MB allowed in app, we set Nginx slightly higher to allow multipart overhead)
    client_max_body_size 6M;
    client_body_timeout 30s;
    client_header_timeout 15s;

    # Apply connection limit
    limit_conn conn_limit 20;

    location / {
        # Rate limit general API access
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        # Forward true client IP securely
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for upstream Node.js server
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Internal health check, can bypass CF restrictions if queried from localhost
    location /api/v1/health {
        proxy_pass http://127.0.0.1:3000;
        allow 127.0.0.1;
    }
}
